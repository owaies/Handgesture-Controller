name: Mobile UI Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-mobile-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply mobile interaction fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          mobile_css = '''
          /* Mobile interaction hardening */
          @media (max-width:760px){
            html,body{height:100%;min-height:100%;overflow:hidden;}
            .app{height:100dvh;min-height:100dvh;display:block;overflow:hidden;}
            .main{height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
            .scroll{height:calc(100dvh - 62px);min-height:0;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:100px;touch-action:pan-y;}
            .bottom{z-index:100;touch-action:manipulation;}
            .bottom button,.upload label,.primary,.danger,.secondary,.icon{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
            .camera-card{scroll-margin-top:12px;}
            .fullscreen-layer{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;z-index:2147483647!important;background:#000!important;}
            .fullscreen-layer canvas{max-width:100vw!important;max-height:100dvh!important;width:auto!important;height:auto!important;}
          }
          '''
          if 'Mobile interaction hardening' not in s:
              s=s.replace('</style>', mobile_css+'\n</style>',1)

          mobile_js = '''
          <script>
          // Mobile controls: use event delegation so the fixed bottom bar remains reliable on touch devices.
          (function(){
            function scrollToId(id){
              var el=document.querySelector(id);
              if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
            }
            document.addEventListener('click',function(e){
              var btn=e.target.closest && e.target.closest('.bottom button');
              if(!btn) return;
              var action=btn.getAttribute('data-action');
              if(action==='camera'){
                e.preventDefault();
                scrollToId('#camera-section');
                if(typeof enableCam==='function' && !window.webcamRunning) enableCam();
              }else if(action==='upload'){
                e.preventDefault();
                var input=document.getElementById('file-input') || document.querySelector('input[type=file]');
                if(input) input.click();
              }else if(action==='fullscreen'){
                e.preventDefault();
                if(typeof onToggleFullscreen==='function') onToggleFullscreen();
              }
            },{passive:false});

            function fixMobileLayout(){
              if(window.innerWidth<=760){
                document.documentElement.style.height='100%';
                document.body.style.height='100%';
                var app=document.querySelector('.app'), main=document.querySelector('.main'), scroll=document.querySelector('.scroll');
                if(app) app.style.height='100dvh';
                if(main) main.style.height='100dvh';
                if(scroll){scroll.style.height='calc(100dvh - 62px)';scroll.style.overflowY='auto';scroll.style.webkitOverflowScrolling='touch';}
              }
            }
            window.addEventListener('resize',fixMobileLayout,{passive:true});
            window.addEventListener('orientationchange',function(){setTimeout(fixMobileLayout,150);},{passive:true});
            document.addEventListener('DOMContentLoaded',fixMobileLayout);
            setTimeout(fixMobileLayout,0);
          })();
          </script>
          '''
          if 'Mobile controls: use event delegation' not in s:
              s=s.replace('</body>',mobile_js+'\n</body>',1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No mobile changes needed"
          else
            git commit -m "Fix mobile scrolling and touch controls [skip ci]"
            git push
          fi

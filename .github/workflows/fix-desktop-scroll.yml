name: Fix desktop scrolling
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[desktop-scroll-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair desktop scroll container
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n<style id="desktop-scroll-repair">\n@media (min-width:761px){\n  html, body { height:100%; min-height:100%; overflow:hidden; }\n  .app { height:100vh; min-height:100vh; overflow:hidden; }\n  .main { height:100vh; min-height:0; overflow:hidden; }\n  .scroll { min-height:0; height:calc(100vh - 72px); overflow-y:auto !important; overflow-x:hidden; -webkit-overflow-scrolling:touch; overscroll-behavior-y:auto; }\n}\n</style>\n'''
          if 'id="desktop-scroll-repair"' not in s:
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix desktop scrolling [desktop-scroll-fixed]"
          git push

name: PPTX Renderer Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATA_ROOT: /tmp/pptx-renderer-data
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: pip install -r pptx-renderer/requirements.txt
      - name: Run renderer validation tests
        run: python -m unittest discover -s pptx-renderer/tests -v

name: Repair mobile UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css=r'''
          /* Final mobile repair: native scrolling + reliable touch controls */
          @media (max-width:760px){
            html{height:auto;min-height:100%;overflow-x:hidden!important;overflow-y:auto!important;}
            body{height:auto;min-height:100dvh;overflow-x:hidden!important;overflow-y:auto!important;touch-action:pan-y!important;}
            .app{height:auto!important;min-height:100dvh!important;display:block!important;overflow:visible!important;}
            .main{height:auto!important;min-height:100dvh!important;display:block!important;overflow:visible!important;}
            .scroll{height:auto!important;min-height:0!important;overflow:visible!important;padding:12px 12px 100px!important;-webkit-overflow-scrolling:touch!important;}
            .topbar{position:sticky;top:0;z-index:100;height:62px!important;}
            .mobile-brand{min-width:0!important;flex:1!important;overflow:hidden!important;}
            .mobile-brand h1{font-size:15px!important;white-space:nowrap!important;}
            .mobile-brand p{white-space:nowrap!important;}
            .status{flex:none!important;max-width:46vw!important;overflow:hidden!important;text-overflow:ellipsis!important;}
            .grid{display:block!important;width:100%!important;}
            .stack{width:100%!important;}
            .upload{min-height:210px!important;}
            #stage{min-height:310px!important;width:100%!important;}
            #stage canvas{max-width:94%!important;max-height:285px!important;}
            .camera-card,.viewer,.card{width:100%!important;}
            .camera{height:220px!important;}
            .bottom{position:fixed!important;bottom:max(10px,env(safe-area-inset-bottom))!important;z-index:10000!important;pointer-events:auto!important;}
            .bottom button{pointer-events:auto!important;touch-action:manipulation!important;}
            .upload label,.primary,.danger,.secondary,.icon{touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important;}
            .fullscreen-layer{z-index:2147483647!important;}
            .fullscreen-layer.is-on{display:flex!important;}
            .fullscreen-layer canvas{max-width:100vw!important;max-height:100dvh!important;}
          }
          '''
          if 'Final mobile repair:' not in s:
              s=s.replace('</style>',css+'</style>',1)
          js=r'''
          
          // Final mobile interaction repair. Uses direct, delegated touch/click handlers.
          (function(){
            function go(sel){var el=document.querySelector(sel);if(el) el.scrollIntoView({behavior:'smooth',block:'start'});}
            function upload(){var f=document.querySelector('input[type="file"]');if(f){f.click();return true}return false;}
            function camera(){go('#camera-section');if(typeof enableCam==='function') enableCam();}
            function present(){if(typeof onToggleFullscreen==='function') onToggleFullscreen();}
            document.addEventListener('click',function(e){
              var b=e.target.closest('[data-action]'); if(!b)return;
              var a=b.getAttribute('data-action');
              if(a==='camera'){e.preventDefault();e.stopPropagation();camera();}
              else if(a==='upload'){e.preventDefault();e.stopPropagation();upload();}
              else if(a==='fullscreen'){e.preventDefault();e.stopPropagation();present();}
            },true);
            document.addEventListener('touchend',function(e){
              var b=e.target.closest('[data-action]'); if(!b)return;
              if(b.dataset.mobileHandled)return;
              b.dataset.mobileHandled='1'; setTimeout(function(){delete b.dataset.mobileHandled},500);
              var a=b.getAttribute('data-action');
              if(a==='camera'){e.preventDefault();camera();}
              else if(a==='upload'){e.preventDefault();upload();}
              else if(a==='fullscreen'){e.preventDefault();present();}
            },{passive:false,capture:true});
            document.addEventListener('keydown',function(e){if(e.key==='Escape'){var x=document.querySelector('.fullscreen-layer');if(x&&x.classList.contains('is-on')){x.classList.remove('is-on');document.body.style.overflow='';}}});
          })();
          '''
          if 'Final mobile interaction repair.' not in s:
              s=s.replace('</script>',js+'</script>')
          p.write_text(s)
          PY
      - name: Commit repaired file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix mobile scrolling and touch controls [mobile-repair]"
          git push
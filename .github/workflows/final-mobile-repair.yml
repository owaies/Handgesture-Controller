name: Final mobile repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[final-mobile-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # The previous repair was accidentally inserted inside the pdf.js script tag.
          marker='// Final mobile interaction repair. Uses direct, delegated touch/click handlers.'
          s=re.sub(r'(<script\s+src="https://cdnjs\.cloudflare\.com/ajax/libs/pdf\.js/3\.11\.174/pdf\.min\.js">)\s*'+re.escape(marker)+r'.*?</script>',r'\1</script>',s,flags=re.S)
          # Remove any previous copy of the repair block outside the PDF script too.
          s=re.sub(r'<script>\s*'+re.escape(marker)+r'.*?</script>', '', s, flags=re.S)
          css=r'''
          /* FINAL MOBILE LAYOUT */
          @media(max-width:760px){
            html{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important}
            body{height:auto!important;min-height:100dvh!important;overflow-x:hidden!important;overflow-y:auto!important;touch-action:pan-y!important}
            .app{display:block!important;height:auto!important;min-height:100dvh!important;overflow:visible!important}
            .main{display:block!important;height:auto!important;min-height:100dvh!important;overflow:visible!important}
            .topbar{height:62px!important;position:sticky!important;top:0!important;z-index:1000!important;padding:9px 12px!important}
            .top-title{display:none!important}
            .mobile-brand{display:flex!important;min-width:0!important;flex:1 1 auto!important;overflow:hidden!important}
            .mobile-brand>div:last-child{min-width:0!important}
            .mobile-brand h1{font-size:15px!important;line-height:1.1!important;white-space:nowrap!important;margin:0!important}
            .mobile-brand p{font-size:9px!important;white-space:nowrap!important;margin:2px 0 0!important}
            .status{flex:0 0 auto!important;max-width:47vw!important;font-size:10px!important;padding:7px 9px!important}
            .scroll{height:auto!important;max-height:none!important;min-height:0!important;overflow:visible!important;padding:12px 12px 100px!important}
            .grid{display:block!important;width:100%!important;max-width:none!important}
            .stack,.right,.card,.upload,.viewer,.camera-card{width:100%!important;max-width:none!important}
            .upload{min-height:205px!important}
            .viewer{min-height:0!important}
            #stage{width:100%!important;min-height:310px!important}
            #stage canvas{max-width:94%!important;max-height:285px!important}
            .camera{height:220px!important}
            .bottom{display:grid!important;position:fixed!important;left:10px!important;right:10px!important;bottom:max(10px,env(safe-area-inset-bottom))!important;height:64px!important;z-index:10000!important;pointer-events:auto!important}
            .bottom button{pointer-events:auto!important;touch-action:manipulation!important}
            .upload label,.primary,.danger,.secondary,.icon{touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important}
            .fullscreen-layer{z-index:2147483647!important}
            .fullscreen-layer.is-on{display:flex!important}
            .fullscreen-layer canvas{max-width:100vw!important;max-height:100dvh!important}
          }
          '''
          s=s.replace('</style>',css+'</style>',1)
          js=r'''
          <script>
          /* FINAL MOBILE CONTROLS */
          (function(){
            function findFile(){return document.querySelector('input[type="file"]')}
            function upload(){var f=findFile();if(f) f.click()}
            function scrollToCamera(){var e=document.getElementById('camera-section');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}
            function startCamera(){if(typeof enableCam==='function')enableCam();else{var b=document.getElementById('start-cam');if(b)b.click()}}
            function camera(){scrollToCamera();setTimeout(startCamera,100)}
            function fullscreen(){if(typeof onToggleFullscreen==='function')onToggleFullscreen();else{var x=document.querySelector('.fullscreen-layer');if(x)x.classList.toggle('is-on')}}
            function handle(a,e){if(a==='upload'){e.preventDefault();upload();return true}if(a==='camera'){e.preventDefault();camera();return true}if(a==='fullscreen'){e.preventDefault();fullscreen();return true}return false}
            document.addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(b)handle(b.getAttribute('data-action'),e)},true)
            document.addEventListener('touchend',function(e){var b=e.target.closest('[data-action]');if(b){var a=b.getAttribute('data-action');if(a==='upload'||a==='camera'||a==='fullscreen'){e.preventDefault();e.stopPropagation();handle(a,e)}}},{passive:false,capture:true})
            document.addEventListener('keydown',function(e){if(e.key==='Escape'){var x=document.querySelector('.fullscreen-layer');if(x&&x.classList.contains('is-on'))x.classList.remove('is-on')}})
          })();
          </script>
          '''
          s=s.replace('</body>',js+'</body>')
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name "owaies"
          git config user.email "owaies786@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix mobile controls and layout [final-mobile-repair]"
          git push
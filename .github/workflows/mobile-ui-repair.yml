name: Apply Liquid Aurora UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ui-repair.yml'

permissions:
  contents: write

jobs:
  liquid-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply liquid aurora theme
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<style id="liquid-aurora-theme">'''
          if old in s:
              raise SystemExit(0)
          css='''
          <style id="liquid-aurora-theme">
          :root{
            --bg:#0B0B0F;--bg2:#15151C;--panel:rgba(255,255,255,.055);--panel-strong:rgba(255,255,255,.075);
            --line:rgba(255,255,255,.12);--line-hi:rgba(255,255,255,.25);--text:#F7F7FA;--muted:#A7A7B5;--muted2:#777784;
            --primary:#8B5CF6;--purple:#EC4899;--cyan:#5EEAD4;--green:#BEF264;--yellow:#FFB86B;--red:#FF6B6B;
            --shadow:0 30px 90px rgba(0,0,0,.42);--radius:24px
          }
          body{
            background-color:#0B0B0F!important;
            background-image:radial-gradient(55vw 45vw at 8% 5%,rgba(139,92,246,.20),transparent 65%),radial-gradient(48vw 42vw at 88% 18%,rgba(236,72,153,.15),transparent 65%),radial-gradient(44vw 38vw at 55% 92%,rgba(94,234,212,.10),transparent 65%),linear-gradient(135deg,#0B0B0F,#121218 55%,#0B0B0F)!important;
            background-attachment:fixed!important
          }
          body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(70px);mix-blend-mode:screen;opacity:.55;animation:liquidFloat 14s ease-in-out infinite alternate}
          body:before{width:34vw;height:34vw;left:-10vw;top:18vh;background:radial-gradient(circle,#8B5CF6 0%,#EC4899 38%,transparent 70%)}
          body:after{width:30vw;height:30vw;right:-8vw;bottom:4vh;background:radial-gradient(circle,#5EEAD4 0%,#BEF264 28%,transparent 70%);animation-delay:-6s}
          .sidebar,.topbar{background:rgba(11,11,15,.62)!important;border-color:rgba(255,255,255,.10)!important}
          .card,.side-card{background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.028))!important;border-color:rgba(255,255,255,.12)!important;box-shadow:0 30px 90px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.06)!important;backdrop-filter:blur(26px) saturate(145%)!important}
          .upload{background:radial-gradient(circle at 25% 0,rgba(139,92,246,.22),transparent 42%),radial-gradient(circle at 85% 100%,rgba(94,234,212,.13),transparent 38%),rgba(255,255,255,.045)!important}
          .upload:before{border-color:rgba(236,72,153,.28)!important}
          .upload-icon,.brand-mark{background:linear-gradient(135deg,#8B5CF6,#EC4899 55%,#FF6B6B)!important;box-shadow:0 14px 45px rgba(139,92,246,.28),0 0 60px rgba(236,72,153,.14)!important}
          .upload label,.primary{background:linear-gradient(135deg,#8B5CF6,#EC4899 55%,#FF6B6B)!important;box-shadow:0 14px 35px rgba(139,92,246,.28)!important}
          .nav button:hover,.nav button.active,.bottom button.active{background:linear-gradient(135deg,rgba(139,92,246,.16),rgba(236,72,153,.08))!important;border-color:rgba(236,72,153,.20)!important}
          .nav button.active{box-shadow:inset 3px 0 #EC4899!important}
          #stage{background:radial-gradient(circle at 20% 20%,rgba(139,92,246,.14),transparent 32%),radial-gradient(circle at 80% 75%,rgba(94,234,212,.10),transparent 32%),linear-gradient(145deg,#0A0A0F,#15151C)!important;border-color:rgba(255,255,255,.12)!important}
          #stage:after{background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.055) 48%,transparent 72%)!important;animation:glassSweep 7s ease-in-out infinite}
          .empty-icon{color:#F0D9FF!important;background:linear-gradient(135deg,rgba(139,92,246,.20),rgba(236,72,153,.12))!important;border-color:rgba(236,72,153,.20)!important}
          .viewer-title i,.metric i{color:#D8A8FF!important}.status-dot.active{background:#BEF264!important;box-shadow:0 0 16px rgba(190,242,100,.72)!important}.online{background:#BEF264!important;box-shadow:0 0 14px rgba(190,242,100,.8)!important}
          .gesture-card{background:rgba(255,255,255,.045)!important;border-color:rgba(255,255,255,.10)!important}.gesture-card:hover,.gesture-card.active{background:linear-gradient(135deg,rgba(139,92,246,.13),rgba(236,72,153,.07))!important;border-color:rgba(236,72,153,.25)!important;box-shadow:0 18px 45px rgba(139,92,246,.13),inset 0 1px 0 rgba(255,255,255,.07)!important}
          .ring{background:conic-gradient(#BEF264 0 0%,rgba(255,255,255,.07) 0 100%)!important}.ring:after{background:#15151C!important}
          .camera{background:#07070A!important;border-color:rgba(255,255,255,.12)!important}.camera-badge{border-color:rgba(190,242,100,.24)!important}.laser{background:rgba(255,107,107,.92)!important;box-shadow:0 0 20px 6px rgba(255,107,107,.48),inset 0 0 5px #fff!important}
          .bottom{background:rgba(12,12,17,.78)!important;border-color:rgba(255,255,255,.13)!important}
          @keyframes liquidFloat{from{transform:translate3d(-2vw,-1vh,0) scale(1)}to{transform:translate3d(3vw,4vh,0) scale(1.14)}}
          @keyframes glassSweep{0%,100%{transform:translateX(-12%);opacity:.35}50%{transform:translateX(12%);opacity:.8}}
          @media(prefers-reduced-motion:reduce){body:before,body:after,#stage:after{animation:none!important}}
          </style>
          '''
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit theme
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply liquid aurora glass theme'
          git push

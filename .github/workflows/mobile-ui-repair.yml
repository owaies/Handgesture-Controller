name: Repair Mobile UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ui-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix malformed CSS and mobile viewer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the previous malformed block whose literal backslash-newlines
          # were being rendered as page text instead of parsed as CSS.
          s = re.sub(r'\\?\\n?<style id="mobile-layout-repair">.*?</style>\\?\\n?', '', s, flags=re.S)
          s = s.replace('\\n\\n', '').replace('\\n', '')

          css = '''
          <style id="mobile-viewer-final-fix">
          @media (max-width:760px){
            html,body{width:100%;max-width:100%;overflow-x:hidden!important;}
            .app,.main,.scroll,.layout,.stack,.card{min-width:0;max-width:100%;}
            .scroll{width:100%;padding:10px 10px 96px!important;overflow-x:hidden;}
            .layout{display:flex!important;flex-direction:column!important;gap:11px!important;}
            .upload,.viewer,.camera-card,.right,.gestures{width:100%!important;max-width:100%!important;}
            #stage{width:100%!important;min-width:0!important;min-height:330px!important;display:grid!important;place-items:center!important;position:relative!important;overflow:hidden!important;}
            #empty-state{position:relative!important;inset:auto!important;transform:none!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;width:min(100%,320px)!important;max-width:320px!important;margin:0 auto!important;padding:18px 12px!important;text-align:center!important;}
            #empty-state .empty-icon{margin:0 auto 13px!important;}
            #empty-state h3,#empty-state p{width:100%!important;text-align:center!important;margin-left:0!important;margin-right:0!important;overflow-wrap:anywhere!important;}
            #empty-state h3{font-size:17px!important;line-height:1.25!important;}
            #empty-state p{font-size:11px!important;line-height:1.6!important;}
            .stage-corner{left:9px!important;top:9px!important;max-width:38%!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
            .hud{right:9px!important;top:9px!important;max-width:52%!important;overflow:hidden;}
            .gesture-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
            .bottom{left:8px!important;right:8px!important;width:auto!important;}
          }
          @media (max-width:390px){
            .scroll{padding-left:8px!important;padding-right:8px!important;}
            #stage{min-height:300px!important;}
            #empty-state{width:min(100%,285px)!important;padding:15px 8px!important;}
            #empty-state h3{font-size:16px!important;}
            #empty-state p{font-size:10px!important;}
          }
          </style>
          '''
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix malformed mobile viewer CSS'
          git push

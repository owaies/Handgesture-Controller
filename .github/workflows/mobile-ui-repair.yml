name: Apply Red Cinematic UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ui-repair.yml'

permissions:
  contents: write

jobs:
  cinematic-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply red cinematic theme
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''<style id="liquid-aurora-theme">
          :root{
            --bg:#050505;--bg2:#0C0C0C;--panel:rgba(12,12,12,.58);--panel-strong:rgba(18,18,18,.72);
            --line:rgba(255,255,255,.12);--line-hi:rgba(255,255,255,.24);--text:#FFF;--muted:rgba(255,255,255,.68);--muted2:rgba(255,255,255,.42);
            --red-deep:#A90018;--red:#C90020;--red-bright:#E6002D;--coral:#FF334D;--coral-soft:#FF4A55;
            --shadow:0 24px 70px rgba(0,0,0,.38);--radius:16px
          }

          html,body{background:#050505!important}
          body{
            background-color:#050505!important;
            background-image:radial-gradient(75vw 75vh at 78% 45%,rgba(230,0,45,.28),transparent 62%),radial-gradient(60vw 70vh at 5% 75%,rgba(169,0,24,.24),transparent 68%),linear-gradient(115deg,#5F0010 0%,#A90018 28%,#C90020 55%,#E6002D 78%,#FF334D 100%)!important;
            background-attachment:fixed!important
          }
          body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:50%;filter:blur(100px);opacity:.25;animation:redFloat 18s ease-in-out infinite alternate}
          body:before{width:42vw;height:42vw;left:-18vw;bottom:-14vw;background:#FF334D}
          body:after{width:34vw;height:34vw;right:-12vw;top:-10vw;background:#A90018;animation-delay:-8s}

          .sidebar,.topbar{background:rgba(5,5,5,.64)!important;border-color:rgba(255,255,255,.10)!important;backdrop-filter:blur(20px)!important}
          .card,.side-card{
            background:rgba(8,8,8,.50)!important;
            border-color:rgba(255,255,255,.13)!important;
            box-shadow:0 24px 70px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.055)!important;
            backdrop-filter:blur(20px) saturate(110%)!important
          }
          .upload{
            background:linear-gradient(115deg,rgba(20,20,20,.58),rgba(10,10,10,.38))!important;
            border-color:rgba(255,255,255,.16)!important
          }
          .upload:before{border-color:rgba(255,255,255,.18)!important}
          .upload-icon,.brand-mark{background:linear-gradient(135deg,#C90020,#E6002D 60%,#FF4A55)!important;box-shadow:0 12px 32px rgba(230,0,45,.20)!important}
          .upload label,.primary{background:#FFF!important;color:#050505!important;box-shadow:0 10px 28px rgba(0,0,0,.22)!important}
          .upload label:hover,.primary:hover{background:#E6002D!important;color:#FFF!important}

          .nav button:hover,.nav button.active,.bottom button.active{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.14)!important}
          .nav button.active{box-shadow:inset 3px 0 #FF334D!important}
          .bottom{background:rgba(7,7,7,.82)!important;border-color:rgba(255,255,255,.15)!important;backdrop-filter:blur(22px)!important}

          #stage{
            background:radial-gradient(60% 80% at 70% 50%,rgba(201,0,32,.12),transparent 62%),#090909!important;
            border-color:rgba(255,255,255,.13)!important;
            box-shadow:inset 0 0 80px rgba(169,0,24,.08)!important
          }
          #stage:after{background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.035) 48%,transparent 72%)!important;animation:glassSweep 9s ease-in-out infinite}
          .empty-icon{color:#FFF!important;background:rgba(230,0,45,.10)!important;border-color:rgba(255,255,255,.16)!important}
          .viewer-title i,.metric i{color:#FF4A55!important}
          .status-dot.active,.online{background:#FF334D!important;box-shadow:0 0 12px rgba(255,51,77,.65)!important}
          .gesture-card{background:rgba(255,255,255,.035)!important;border-color:rgba(255,255,255,.10)!important}
          .gesture-card:hover,.gesture-card.active{background:rgba(230,0,45,.10)!important;border-color:rgba(255,51,77,.28)!important;box-shadow:0 14px 34px rgba(169,0,24,.16)!important}
          .ring{background:conic-gradient(#FF334D 0 0%,rgba(255,255,255,.08) 0 100%)!important}.ring:after{background:#111!important}
          .camera{background:#050505!important;border-color:rgba(255,255,255,.12)!important}.camera-badge{border-color:rgba(255,51,77,.28)!important}.laser{background:#FF334D!important;box-shadow:0 0 18px 5px rgba(255,51,77,.38),inset 0 0 5px #fff!important}

          @media(max-width:760px){
            body{background-image:radial-gradient(430px 360px at 100% 15%,rgba(230,0,45,.20),transparent 70%),radial-gradient(380px 320px at 0% 78%,rgba(169,0,24,.20),transparent 70%),linear-gradient(150deg,#42000C,#970018 45%,#D50027 78%,#FF334D 100%)!important}
            body:before{width:65vw;height:65vw;left:-30vw;bottom:8vh;filter:blur(85px);opacity:.18}
            body:after{width:55vw;height:55vw;right:-25vw;top:12vh;filter:blur(85px);opacity:.16}
            .topbar{height:58px!important;padding:8px 12px!important;background:rgba(5,5,5,.76)!important}
            .mobile-brand .brand-mark{width:32px!important;height:32px!important;flex-basis:32px!important;border-radius:9px!important}
            .mobile-brand strong{font-size:13px!important}.mobile-brand span{font-size:8px!important}
            .status{min-height:32px!important;padding:6px 9px!important;font-size:8px!important;background:rgba(0,0,0,.30)!important;border-color:rgba(255,255,255,.13)!important}
            .scroll{padding:10px 12px 82px!important}.layout{gap:10px!important}.stack{gap:10px!important}
            .card{border-radius:16px!important;box-shadow:0 18px 44px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05)!important}

            .upload{min-height:188px!important;padding:16px 14px!important;border-radius:16px!important}
            .upload:before{inset:7px!important;border-radius:12px!important}
            .upload-icon{width:50px!important;height:50px!important;border-radius:14px!important;font-size:19px!important}
            .upload h3{font-size:16px!important;margin:9px 0 4px!important}.upload p{font-size:10px!important;margin-bottom:10px!important}
            .upload label{width:min(100%,240px)!important;min-height:41px!important;border-radius:11px!important;font-size:13px!important}.upload small{font-size:8px!important;margin-top:6px!important}

            .viewer{padding:8px!important;border-radius:16px!important}.viewer-head{margin-bottom:6px!important}.viewer-title{font-size:10px!important}.viewer-actions{gap:5px!important}.viewer-actions .icon{width:30px!important;height:30px!important;border-radius:8px!important}
            #stage{height:230px!important;min-height:230px!important;border-radius:12px!important}
            #stage canvas{max-width:88%!important;max-height:198px!important}
            #empty-state{width:min(100%,270px)!important;max-width:270px!important;padding:8px!important}
            #empty-state .empty-icon{width:46px!important;height:46px!important;margin-bottom:8px!important;border-radius:12px!important;font-size:18px!important}
            #empty-state h3{font-size:15px!important;line-height:1.25!important;margin-bottom:4px!important}.empty p{font-size:9px!important;line-height:1.5!important}
            .stage-corner{left:7px!important;top:7px!important;font-size:7px!important;padding:4px 6px!important;opacity:.68}.hud{display:none!important}

            .camera-card{padding:9px!important}.camera{height:205px!important;border-radius:12px!important}.metric{font-size:10px!important;margin-bottom:6px!important}
            .gestures{padding:10px!important}.section-head{margin-bottom:7px!important}.gesture-card{min-height:108px!important;padding:9px!important;border-radius:12px!important}.gesture-card .gi{font-size:22px!important;margin-bottom:4px!important}.gesture-card b{font-size:10px!important}.gesture-card span{font-size:8px!important}
            .right{gap:8px!important}.metric-card{padding:11px!important;border-radius:14px!important}.metric-big{font-size:18px!important}

            .bottom{left:10px!important;right:10px!important;bottom:max(6px,env(safe-area-inset-bottom))!important;height:56px!important;padding:4px!important;border-radius:15px!important;box-shadow:0 14px 40px rgba(0,0,0,.42)!important}
            .bottom button{border-radius:11px!important;font-size:8px!important;gap:3px!important}.bottom button i{font-size:14px!important}.bottom .fab{background:#FFF!important;color:#050505!important;box-shadow:0 7px 20px rgba(0,0,0,.25)!important}
          }
          @media(max-width:390px){
            .scroll{padding-left:9px!important;padding-right:9px!important}.status{font-size:7px!important}.status #status-text{max-width:74px!important;overflow:hidden;text-overflow:ellipsis}
            .upload{min-height:182px!important}.upload-icon{width:46px!important;height:46px!important}.upload h3{font-size:15px!important}
            #stage{height:212px!important;min-height:212px!important}#stage canvas{max-height:182px!important}
          }
          @keyframes redFloat{from{transform:translate3d(-2vw,-1vh,0) scale(1)}to{transform:translate3d(3vw,3vh,0) scale(1.08)}}
          @keyframes glassSweep{0%,100%{transform:translateX(-10%);opacity:.18}50%{transform:translateX(10%);opacity:.55}}
          @media(prefers-reduced-motion:reduce){body:before,body:after,#stage:after{animation:none!important}}
          </style>'''

          pattern = r'<style id="liquid-aurora-theme">.*?</style>'
          if re.search(pattern, s, flags=re.S):
              s = re.sub(pattern, css, s, count=1, flags=re.S)
          else:
              s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit theme
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply red cinematic UI'
          git push

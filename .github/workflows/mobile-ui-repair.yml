name: Apply Master Reference Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ui-repair.yml'

permissions:
  contents: write

jobs:
  master-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix PDF viewer sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Replace the previous fixed-height mobile PDF rules with rules that let
          # the rendered PDF determine the stage height.
          css=r'''<style id="dynamic-pdf-viewer-fix">
          @media(max-width:760px){
            .viewer{height:auto!important;min-height:0!important;width:100%!important}
            .viewer:not(.pdf-loaded){height:clamp(300px,82vw,370px)!important;min-height:300px!important}
            .viewer.pdf-loaded{height:auto!important;min-height:0!important}
            .viewer.pdf-loaded #stage{height:auto!important;min-height:0!important;display:block!important;overflow:hidden!important;padding:0!important;aspect-ratio:auto!important}
            .viewer.pdf-loaded #stage canvas{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;max-height:none!important;margin:0!important;object-fit:contain!important;border-radius:5px!important}
            .viewer.pdf-loaded #stage:after{display:none!important}
            .viewer.pdf-loaded .empty{display:none!important}
            .viewer.pdf-loaded .hud,.viewer.pdf-loaded .stage-corner{position:absolute!important}
          }
          @media(max-width:430px){
            .viewer:not(.pdf-loaded){height:clamp(285px,82vw,360px)!important;min-height:285px!important}
          }
          </style>'''
          s=re.sub(r'<style id="dynamic-pdf-viewer-fix">.*?</style>','',s,flags=re.S)
          s=s.replace('</head>',css+'\n</head>',1)

          # The old renderPage used stage.clientHeight to calculate the PDF scale,
          # which made the canvas depend on a fixed-height container. On mobile,
          # calculate scale from width only, then the canvas's natural aspect ratio
          # determines the stage height.
          pattern=r'async function renderPage\(num\)\{.*?\n\}async function renderFullscreenPage'
          replacement='''async function renderPage(num){if(!pdfDoc||isRendering)return;isRendering=true;try{const page=await pdfDoc.getPage(num);const base=page.getViewport({scale:1});const mobile=window.matchMedia(\'(max-width:760px)\').matches;if(mobile){const width=Math.max(1,stage.clientWidth);const scale=Math.min(2.5,width/base.width);const vp=page.getViewport({scale});pdfCanvas.width=Math.floor(vp.width);pdfCanvas.height=Math.floor(vp.height);stage.style.setProperty(\'--pdf-stage-height\',`${Math.ceil(vp.height*(stage.clientWidth/vp.width))}px`);viewerClassSync();await page.render({canvasContext:pdfCtx,viewport:vp}).promise}else{const maxW=Math.max(320,stage.clientWidth-32),maxH=Math.max(220,stage.clientHeight-32);const scale=Math.min(1.7,maxW/base.width,maxH/base.height);const vp=page.getViewport({scale});pdfCanvas.width=Math.floor(vp.width);pdfCanvas.height=Math.floor(vp.height);await page.render({canvasContext:pdfCtx,viewport:vp}).promise}}catch(err){console.error(err)}finally{isRendering=false}}async function renderFullscreenPage'''
          if not re.search(pattern,s,flags=re.S):
              raise SystemExit('renderPage pattern not found')
          s=re.sub(pattern,replacement,s,count=1,flags=re.S)

          # Keep the viewer class synchronized from the actual PDF canvas.
          helper=r'''<script id="pdf-viewer-class-sync">
          function viewerClassSync(){
            const v=document.querySelector('.viewer');
            const c=document.getElementById('pdf-render');
            if(!v||!c)return;
            const loaded=c.width>0&&c.height>0;
            v.classList.toggle('pdf-loaded',loaded);
            if(loaded&&window.matchMedia('(max-width:760px)').matches){
              const ratio=c.height/c.width;
              const w=document.getElementById('stage').clientWidth;
              if(ratio>0&&w>0)document.getElementById('stage').style.setProperty('--pdf-stage-height',`${Math.ceil(w*ratio)}px`);
            }
          }
          window.addEventListener('resize',()=>setTimeout(viewerClassSync,50),{passive:true});
          </script>'''
          s=re.sub(r'<script id="pdf-viewer-class-sync">.*?</script>','',s,flags=re.S)
          s=s.replace('</body>',helper+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit PDF viewer fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix PDF viewer to fit every page ratio'
          git push

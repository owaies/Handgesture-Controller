name: Match Reference Mobile UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ui-repair.yml'

permissions:
  contents: write

jobs:
  reference-mobile-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reference UI system
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''<style id="reference-mobile-ui">
          :root{
            --bg:#070608;--panel:rgba(19,15,20,.68);--panel2:rgba(31,20,25,.76);--line:rgba(255,255,255,.13);
            --text:#fff;--muted:rgba(255,255,255,.64);--muted2:rgba(255,255,255,.40);
            --red:#ff173b;--red2:#ff3b55;--coral:#ff6a72;--pink:#ff3150;--green:#20e394;
            --shadow:0 22px 65px rgba(0,0,0,.48)
          }
          html{background:#070608!important}
          body{
            margin:0!important;color:var(--text)!important;background:#070608!important;overflow-x:hidden!important;
            background-image:
              radial-gradient(520px 440px at 92% 4%,rgba(255,37,65,.26),transparent 68%),
              radial-gradient(420px 520px at 4% 34%,rgba(170,0,28,.18),transparent 70%),
              radial-gradient(520px 360px at 90% 82%,rgba(255,39,70,.18),transparent 68%),
              linear-gradient(145deg,#050506 0%,#0c080b 44%,#050506 100%)!important;
          }
          body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:50%;mix-blend-mode:screen;filter:blur(24px);will-change:transform}
          body:before{width:250px;height:250px;right:-70px;top:100px;background:radial-gradient(circle at 35% 35%,rgba(255,75,92,.82),rgba(188,0,35,.22) 48%,transparent 72%);animation:referenceOrb 10s ease-in-out infinite alternate}
          body:after{width:330px;height:190px;left:35%;bottom:-70px;background:radial-gradient(ellipse,rgba(255,32,61,.48),rgba(137,0,24,.12) 52%,transparent 74%);animation:referenceOrb2 13s ease-in-out infinite alternate}

          .app{background:transparent!important;display:block!important;min-height:100vh!important}
          .sidebar{display:none!important}
          .main{width:100%!important;min-width:0!important}
          .topbar{
            position:sticky!important;top:0!important;z-index:100!important;height:76px!important;padding:10px 20px!important;
            background:rgba(5,5,6,.76)!important;border-bottom:1px solid rgba(255,255,255,.10)!important;
            backdrop-filter:blur(26px) saturate(130%)!important
          }
          .top-title{display:none!important}
          .mobile-brand{display:flex!important;align-items:center!important;gap:10px!important}
          .mobile-brand .brand-mark{width:48px!important;height:48px!important;flex:0 0 48px!important;border-radius:14px!important;background:linear-gradient(145deg,#ff5a67,#ff123b 58%,#b50020)!important;border:1px solid rgba(255,255,255,.25)!important;box-shadow:0 12px 30px rgba(255,19,59,.32),inset 0 1px rgba(255,255,255,.35)!important}
          .mobile-brand strong{font-size:18px!important;letter-spacing:-.5px!important}.mobile-brand span{display:block!important;font-size:11px!important;color:var(--muted)!important;margin-top:2px!important}
          .status{min-height:40px!important;padding:0 13px!important;border:1px solid rgba(255,255,255,.15)!important;border-radius:999px!important;background:rgba(9,8,10,.66)!important;font-size:11px!important;box-shadow:0 10px 30px rgba(0,0,0,.25)!important}
          .status-dot{width:9px!important;height:9px!important;background:var(--red)!important;box-shadow:0 0 14px rgba(255,23,59,.75)!important}
          .counter{display:none!important}

          .scroll{padding:0 22px 104px!important}
          .layout{display:grid!important;grid-template-columns:repeat(12,minmax(0,1fr))!important;gap:18px!important;max-width:1400px!important;margin:0 auto!important}
          .layout>.stack{display:contents!important}
          .card,.side-card{
            position:relative!important;overflow:hidden!important;border:1px solid var(--line)!important;border-radius:21px!important;
            background:linear-gradient(145deg,rgba(31,20,25,.74),rgba(9,8,10,.72))!important;
            box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08)!important;backdrop-filter:blur(22px) saturate(125%)!important
          }
          .card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.065),transparent 25%,transparent 72%,rgba(255,42,67,.06));opacity:.9}

          /* Reference hero: headline, camera pill, AI pill and luminous hand-like focal object. */
          .layout:before{
            content:"TURN GESTURES INTO IMPACT\\A Present\\A Smarter.\\A Upload your slides, start the camera, and control\\A your presentation with simple hand gestures.";
            grid-column:1/-1;grid-row:1;min-height:240px;padding:28px 52% 20px 4px;box-sizing:border-box;white-space:pre-line;z-index:2;
            display:flex;align-items:flex-start;justify-content:center;flex-direction:column;
            font-weight:500;font-size:13px;line-height:1.55;color:var(--muted);
            background:
              radial-gradient(170px 170px at 91% 22%,rgba(255,80,94,.48),transparent 70%),
              radial-gradient(260px 230px at 74% 82%,rgba(255,18,54,.16),transparent 70%),
              transparent!important;
            border-radius:0!important;pointer-events:none
          }
          .layout:before{letter-spacing:0}
          .layout:after{
            content:"\\f256";font-family:"Font Awesome 6 Free";font-weight:900;
            position:absolute;z-index:3;right:5%;top:78px;width:43%;height:250px;display:grid;place-items:center;
            font-size:190px;color:rgba(255,255,255,.13);transform:rotate(-18deg);
            text-shadow:0 0 18px rgba(255,74,89,.45),0 0 55px rgba(255,22,58,.30),20px 20px 50px rgba(0,0,0,.65);
            filter:drop-shadow(0 15px 24px rgba(255,35,62,.25));pointer-events:none
          }

          .upload{grid-column:1/7!important;grid-row:2!important;min-height:132px!important;padding:18px 22px!important;display:grid!important;grid-template-columns:48px 1fr auto!important;grid-template-rows:auto auto auto!important;column-gap:13px!important;align-content:center!important;text-align:left!important;background:radial-gradient(230px 140px at 70% 25%,rgba(255,26,61,.28),transparent 70%),linear-gradient(145deg,rgba(255,22,55,.64),rgba(71,11,23,.58))!important}
          .upload:before{inset:9px!important;border:1px solid rgba(255,255,255,.10)!important;border-radius:16px!important}
          .upload-icon{grid-row:1/4!important;width:48px!important;height:48px!important;border-radius:14px!important;font-size:20px!important;background:linear-gradient(145deg,#ff5965,#ff123b 60%,#b80021)!important;color:#fff!important;border:1px solid rgba(255,255,255,.24)!important;box-shadow:0 12px 30px rgba(255,16,57,.34)!important;animation:none!important}
          .upload h3{font-size:17px!important;margin:0 0 3px!important}.upload p{font-size:10px!important;margin:0 0 8px!important;color:rgba(255,255,255,.66)!important}.upload label{min-width:0!important;width:42px!important;height:42px!important;min-height:42px!important;padding:0!important;border-radius:50%!important;align-self:center!important;grid-column:3!important;grid-row:1/4!important;background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.18)!important;box-shadow:none!important;font-size:0!important}.upload label:after{content:"→";font-size:22px;color:#fff}.upload small{grid-column:2!important;margin:0!important;font-size:9px!important;color:rgba(255,255,255,.48)!important}

          .camera-card{grid-column:7/13!important;grid-row:2!important;padding:14px!important;min-height:132px!important}.camera-card .camera{height:100%!important;min-height:100px!important;border-radius:15px!important}.camera-card .metric{font-size:10px!important}.camera-actions{margin-top:8px!important}.camera-actions .primary,.camera-actions .danger{min-height:38px!important;border-radius:12px!important}
          .camera-card:not(:has(video[style*="display: none"])){min-height:300px!important}
          .camera{background:#050506!important;border-color:rgba(255,255,255,.12)!important}.camera-badge{background:rgba(5,12,10,.78)!important;border-color:rgba(32,227,148,.28)!important}.online{background:var(--green)!important;box-shadow:0 0 14px rgba(32,227,148,.7)!important}

          .gestures{grid-column:7/13!important;grid-row:3!important;padding:15px!important}.section-head{margin-bottom:10px!important}.section-head span:first-child{font-size:11px!important}.section-head span:last-child{font-size:9px!important}.gesture-grid{grid-template-columns:repeat(2,1fr)!important;gap:9px!important}.gesture-card{min-height:112px!important;padding:11px!important;border-radius:15px!important;background:rgba(31,20,25,.58)!important;border-color:rgba(255,255,255,.10)!important}.gesture-card .gi{font-size:25px!important;margin-bottom:5px!important}.gesture-card b{font-size:10px!important}.gesture-card span{font-size:8px!important;color:var(--muted)!important}.gesture-card.active,.gesture-card:hover{background:rgba(88,14,28,.52)!important;border-color:rgba(255,67,86,.35)!important;box-shadow:0 12px 30px rgba(255,25,55,.13)!important}

          .metric-card{padding:15px!important;min-height:128px!important}.metric-top{font-size:10px!important}.metric-big{font-size:20px!important}.ring{background:conic-gradient(var(--red2) 0 0%,rgba(255,255,255,.08) 0 100%)!important}.ring:after{background:#120b0f!important}
          .right .metric-card:nth-child(1){grid-column:1/7!important;grid-row:3!important}.right .metric-card:nth-child(2){grid-column:1/7!important;grid-row:4!important}.right .metric-card:nth-child(3){grid-column:7/13!important;grid-row:4!important}.right .metric-card:nth-child(4){grid-column:7/13!important;grid-row:5!important}
          .viewer{grid-column:1/13!important;grid-row:5/8!important;padding:14px!important}.viewer-head{margin-bottom:10px!important}.viewer-title{font-size:12px!important}.icon{width:36px!important;height:36px!important;border-radius:11px!important;background:rgba(255,255,255,.045)!important;border-color:var(--line)!important}
          #stage{min-height:420px!important;background:radial-gradient(ellipse at 72% 26%,rgba(255,25,59,.13),transparent 45%),#050506!important;border-color:rgba(255,255,255,.12)!important}.empty-icon{background:rgba(255,31,62,.10)!important;border-color:rgba(255,71,89,.22)!important;color:#fff!important}
          .bottom{display:flex!important;position:fixed!important;z-index:120!important;left:22px!important;right:22px!important;bottom:max(10px,env(safe-area-inset-bottom))!important;height:64px!important;padding:5px!important;border-radius:22px!important;background:rgba(8,7,9,.80)!important;border:1px solid rgba(255,255,255,.15)!important;backdrop-filter:blur(28px) saturate(135%)!important;box-shadow:0 20px 55px rgba(0,0,0,.62),inset 0 1px rgba(255,255,255,.08)!important}.bottom button{flex:1!important;border-radius:18px!important;font-size:9px!important}.bottom button i{font-size:15px!important}.bottom button.active{background:linear-gradient(145deg,rgba(255,30,61,.30),rgba(129,0,23,.16))!important;border-color:rgba(255,76,93,.34)!important;box-shadow:0 8px 25px rgba(255,21,54,.14)!important}.bottom .fab{background:#fff!important;color:#080709!important}

          @media(max-width:760px){
            .topbar{height:72px!important;padding:9px 20px!important}.mobile-brand .brand-mark{width:44px!important;height:44px!important;flex-basis:44px!important}.mobile-brand strong{font-size:17px!important}.mobile-brand span{font-size:10px!important}.status{font-size:10px!important;min-height:38px!important;padding:0 12px!important}
            .scroll{padding:0 22px 92px!important}.layout{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:16px!important}
            .layout:before{grid-column:1/-1!important;grid-row:1!important;min-height:215px!important;padding:25px 48% 16px 4px!important;font-size:11px!important;line-height:1.5!important;justify-content:flex-start!important;background:radial-gradient(170px 150px at 88% 30%,rgba(255,55,75,.38),transparent 72%)!important}
            .layout:before{content:"TURN GESTURES INTO IMPACT\\A Present\\A Smarter.\\A Upload your slides, start the camera, and control\\A your presentation with simple hand gestures."}
            .layout:after{top:80px!important;right:1%!important;width:50%!important;height:190px!important;font-size:150px!important;transform:rotate(-18deg)!important}
            .upload{grid-column:1/2!important;grid-row:2!important;min-height:130px!important;padding:14px!important;grid-template-columns:40px 1fr 34px!important;column-gap:9px!important}.upload-icon{width:40px!important;height:40px!important;font-size:17px!important;border-radius:12px!important}.upload h3{font-size:14px!important}.upload p{font-size:8px!important;margin-bottom:6px!important}.upload small{font-size:7px!important}.upload label{width:34px!important;height:34px!important;min-height:34px!important}.upload label:after{font-size:18px!important}
            .camera-card{grid-column:2/3!important;grid-row:2!important;min-height:130px!important;padding:10px!important}.camera-card .camera{min-height:96px!important;height:96px!important}.camera-card .metric{font-size:8px!important;margin-bottom:5px!important}.camera-actions{margin-top:5px!important}.camera-actions .primary{min-height:34px!important;font-size:9px!important}.camera-actions .danger{min-height:34px!important;font-size:9px!important}
            .gestures{grid-column:2/3!important;grid-row:3!important;padding:10px!important}.section-head{margin-bottom:7px!important}.section-head span:first-child{font-size:9px!important}.gesture-grid{gap:6px!important}.gesture-card{min-height:91px!important;padding:8px!important;border-radius:12px!important}.gesture-card .gi{font-size:20px!important;margin-bottom:3px!important}.gesture-card b{font-size:8px!important}.gesture-card span{font-size:7px!important}
            .right .metric-card:nth-child(1){grid-column:1/2!important;grid-row:3!important;min-height:112px!important}.right .metric-card:nth-child(2){grid-column:1/2!important;grid-row:4!important;min-height:112px!important}.right .metric-card:nth-child(3){grid-column:1/2!important;grid-row:5!important;min-height:112px!important}.right .metric-card:nth-child(4){grid-column:1/2!important;grid-row:6!important;min-height:112px!important}
            .viewer{grid-column:1/3!important;grid-row:7!important;padding:10px!important}.viewer-title{font-size:9px!important}.viewer-actions .icon{width:31px!important;height:31px!important}#stage{min-height:260px!important;height:260px!important;border-radius:14px!important}.empty-icon{width:50px!important;height:50px!important}.empty h3{font-size:16px!important}.empty p{font-size:9px!important}
            .bottom{left:20px!important;right:20px!important;height:62px!important}.bottom button{font-size:8px!important}
          }
          @media(min-width:761px){.layout:before{min-height:270px;font-size:16px}.layout:after{font-size:230px;top:80px}.upload{grid-column:1/7!important}.camera-card{grid-column:7/13!important}.gestures{grid-column:7/13!important}.viewer{grid-column:1/13!important}.bottom{display:none!important}}
          @media(max-width:390px){.scroll{padding-left:16px!important;padding-right:16px!important}.layout{gap:12px!important}.layout:before{min-height:205px;padding-right:46%!important}.upload{padding:11px!important}.upload h3{font-size:12px!important}.camera-card{padding:8px!important}.gesture-card{min-height:84px!important}.bottom{left:14px!important;right:14px!important}}
          @keyframes referenceOrb{from{transform:translate3d(-3px,-3px,0) scale(.92)}to{transform:translate3d(-18px,16px,0) scale(1.08)}}
          @keyframes referenceOrb2{from{transform:translate3d(0,5px,0) scale(.94)}to{transform:translate3d(-30px,-15px,0) scale(1.1)}}
          @media(prefers-reduced-motion:reduce){body:before,body:after{animation:none!important}}
          </style>'''

          # Replace any previous generated visual-system block.
          s = re.sub(r'<style id="reference-mobile-ui">.*?</style>', '', s, flags=re.S)
          s = re.sub(r'<style id="red-cinematic-bento">.*?</style>', '', s, flags=re.S)
          s = re.sub(r'<style id="liquid-aurora-theme">.*?</style>', '', s, flags=re.S)
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit reference UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Match reference mobile UI and UX'
          git push

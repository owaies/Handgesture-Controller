name: Mobile UI Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ui-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair mobile presentation layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          marker = 'id="mobile-layout-repair"'
          if marker in html:
              raise SystemExit(0)

          html = html.replace('Begin presenting', 'Ready when you are')
          html = html.replace('Upload a PDF and control it with your hands.', 'Upload a PDF, start the camera, and control the presentation with simple hand gestures.')

          repair_css = '''
          <style id="mobile-layout-repair">
          @media (max-width:760px){
            html,body{width:100%;max-width:100%;overflow-x:hidden!important;}
            .app,.main,.scroll,.layout,.stack,.card{max-width:100%;min-width:0;}
            .topbar{width:100%;box-sizing:border-box;}
            .mobile-brand{min-width:0;overflow:hidden;}
            .mobile-brand strong,.mobile-brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
            .status{flex:0 0 auto;max-width:43vw;overflow:hidden;}
            .scroll{width:100%;box-sizing:border-box;padding-left:10px!important;padding-right:10px!important;}
            .upload{width:100%;overflow:hidden;}
            .viewer{width:100%;overflow:hidden;}
            #stage{width:100%!important;min-width:0!important;display:grid!important;place-items:center!important;align-items:center!important;justify-items:center!important;overflow:hidden!important;}
            #empty-state{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;inset:auto!important;transform:none!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;width:min(100%,320px)!important;max-width:320px!important;margin:0 auto!important;padding:20px 14px!important;text-align:center!important;}
            #empty-state .empty-icon{margin:0 auto 13px!important;flex:0 0 auto;}
            #empty-state h3,#empty-state p{width:100%!important;margin-left:0!important;margin-right:0!important;text-align:center!important;overflow-wrap:anywhere;}
            #empty-state h3{font-size:17px!important;line-height:1.25!important;}
            #empty-state p{font-size:11px!important;line-height:1.6!important;}
            .stage-corner{max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
            .gesture-grid{width:100%;grid-template-columns:repeat(2,minmax(0,1fr))!important;}
            .gesture-card{min-width:0;overflow:hidden;}
            .bottom{left:8px!important;right:8px!important;width:auto!important;}
          }
          @media (max-width:390px){
            .scroll{padding-left:8px!important;padding-right:8px!important;}
            #stage{min-height:300px!important;}
            #empty-state{width:min(100%,290px)!important;padding:16px 10px!important;}
            #empty-state h3{font-size:16px!important;}
            #empty-state p{font-size:10px!important;}
          }
          </style>
          '''

          html = html.replace('</head>', repair_css + '</head>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit repaired UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix mobile presentation viewer layout'
          git push

name: Apply Red Cinematic UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ui-repair.yml'

permissions:
  contents: write

jobs:
  red-bento-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cinematic 3D bento UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''<style id="red-cinematic-bento">
          :root{
            --bg:#050506;--bg2:#0b090b;--surface:rgba(18,14,17,.68);--surface2:rgba(30,18,22,.72);
            --line:rgba(255,255,255,.13);--line2:rgba(255,255,255,.20);--text:#fff;--muted:rgba(255,255,255,.67);--muted2:rgba(255,255,255,.42);
            --red:#e6002d;--red2:#ff334d;--coral:#ff4a55;--deep:#a90018;--green:#32e69a;--shadow:0 25px 80px rgba(0,0,0,.48);--radius:18px
          }
          html{background:#050506!important}
          body{
            color:var(--text)!important;background:#050506!important;position:relative;overflow-x:hidden;
            background-image:radial-gradient(45vw 35vw at 78% 17%,rgba(255,51,77,.18),transparent 67%),radial-gradient(38vw 32vw at 12% 72%,rgba(169,0,24,.22),transparent 70%),radial-gradient(34vw 30vw at 90% 92%,rgba(230,0,45,.14),transparent 70%),linear-gradient(135deg,#050506 0%,#0b0709 48%,#050506 100%)!important;
          }
          body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;mix-blend-mode:screen;filter:blur(35px);will-change:transform}
          body:before{width:32vw;height:32vw;left:62vw;top:5vh;background:radial-gradient(circle at 35% 35%,rgba(255,74,85,.95),rgba(230,0,45,.40) 38%,transparent 72%);box-shadow:inset -35px -35px 70px rgba(0,0,0,.45);animation:orbFloat 12s ease-in-out infinite alternate}
          body:after{width:42vw;height:22vw;left:53vw;bottom:-8vw;background:radial-gradient(ellipse,rgba(255,51,77,.68),rgba(169,0,24,.18) 48%,transparent 72%);filter:blur(42px);animation:orbFloat2 15s ease-in-out infinite alternate}
          .app{background:transparent!important}
          .sidebar,.topbar{background:rgba(5,5,6,.66)!important;border-color:rgba(255,255,255,.10)!important;backdrop-filter:blur(24px) saturate(125%)!important}
          .brand-mark,.mobile-brand .brand-mark{background:linear-gradient(145deg,#ff5a62,#e6002d 58%,#a90018)!important;border:1px solid rgba(255,255,255,.24)!important;box-shadow:0 12px 35px rgba(230,0,45,.34),inset 0 1px 1px rgba(255,255,255,.38)!important}
          .nav button:hover,.nav button.active{background:rgba(230,0,45,.10)!important;border-color:rgba(255,74,85,.20)!important}.nav button.active{box-shadow:inset 3px 0 var(--red2)!important}
          .side-card,.card{
            background:linear-gradient(145deg,rgba(28,17,21,.72),rgba(9,8,10,.68))!important;border:1px solid var(--line)!important;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.07)!important;backdrop-filter:blur(22px) saturate(125%)!important;
          }
          .card{border-radius:var(--radius)!important;position:relative;overflow:hidden}
          .card:before,.side-card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.07),transparent 24%,transparent 70%,rgba(255,51,77,.06));opacity:.7}
          .upload{min-height:230px!important;background:radial-gradient(ellipse at 78% 20%,rgba(255,51,77,.22),transparent 45%),linear-gradient(145deg,rgba(55,15,22,.82),rgba(10,8,10,.74))!important}
          .upload:before{border-color:rgba(255,74,85,.28)!important;border-radius:14px!important}
          .upload-icon{background:linear-gradient(145deg,#ff5a62,#e6002d 62%,#a90018)!important;color:#fff!important;border-color:rgba(255,255,255,.26)!important;box-shadow:0 18px 42px rgba(230,0,45,.32)!important}
          .upload label,.primary{background:linear-gradient(100deg,#d80027,#ff334d)!important;color:#fff!important;border-color:rgba(255,255,255,.16)!important;box-shadow:0 14px 34px rgba(230,0,45,.30),inset 0 1px rgba(255,255,255,.22)!important}
          .upload label:hover,.primary:hover{box-shadow:0 18px 42px rgba(230,0,45,.40)!important;transform:translateY(-2px)!important}
          .viewer{background:rgba(12,10,12,.72)!important}.viewer-title,.section-head span:first-child{color:#fff!important}.viewer-title i,.metric i{color:#ff6b76!important}
          #stage{min-height:470px!important;background:radial-gradient(ellipse at 72% 28%,rgba(230,0,45,.14),transparent 42%),radial-gradient(ellipse at 18% 85%,rgba(169,0,24,.12),transparent 42%),#050506!important;border-color:rgba(255,255,255,.12)!important}
          #stage:before{content:"";position:absolute;width:55%;height:75%;right:-18%;top:-28%;border-radius:50%;background:radial-gradient(circle at 35% 40%,rgba(255,74,85,.20),rgba(230,0,45,.08) 36%,transparent 70%);filter:blur(20px);animation:stageOrb 10s ease-in-out infinite alternate;pointer-events:none}
          #stage:after{background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.035) 48%,transparent 72%)!important;animation:glassSweep 7s ease-in-out infinite}
          .empty-icon{background:linear-gradient(145deg,rgba(255,51,77,.22),rgba(169,0,24,.10))!important;border-color:rgba(255,74,85,.25)!important;color:#fff!important;box-shadow:inset 0 1px rgba(255,255,255,.12),0 12px 35px rgba(230,0,45,.12)!important}
          .stage-corner,.hud{background:rgba(8,7,9,.68)!important;border-color:rgba(255,255,255,.12)!important;backdrop-filter:blur(12px)!important}
          .icon,.secondary{background:rgba(255,255,255,.045)!important;border-color:var(--line)!important}.icon:hover,.secondary:hover{background:rgba(230,0,45,.13)!important;border-color:rgba(255,74,85,.30)!important}
          .camera{background:#030304!important;border-color:rgba(255,255,255,.12)!important}.camera-badge{background:rgba(5,12,10,.76)!important;border-color:rgba(50,230,154,.28)!important}.online,.status-dot.active{background:var(--green)!important;box-shadow:0 0 14px rgba(50,230,154,.7)!important}
          .danger{background:linear-gradient(100deg,#d80027,#ff334d)!important;box-shadow:0 12px 30px rgba(230,0,45,.26)!important}.laser{background:var(--coral)!important;box-shadow:0 0 20px 6px rgba(255,74,85,.45),inset 0 0 5px #fff!important}
          .gesture-card{background:linear-gradient(145deg,rgba(36,20,24,.72),rgba(12,9,12,.72))!important;border-color:rgba(255,255,255,.11)!important;box-shadow:inset 0 1px rgba(255,255,255,.05)!important}.gesture-card:hover,.gesture-card.active{background:linear-gradient(145deg,rgba(78,18,29,.72),rgba(18,9,13,.78))!important;border-color:rgba(255,74,85,.34)!important;box-shadow:0 15px 40px rgba(230,0,45,.14),inset 0 1px rgba(255,255,255,.08)!important}
          .ring{background:conic-gradient(var(--red2) 0 0%,rgba(255,255,255,.08) 0 100%)!important}.ring:after{background:#100b0e!important}
          .metric-card{background:linear-gradient(145deg,rgba(27,15,20,.74),rgba(9,8,10,.70))!important}.metric-big{color:#fff!important}.bottom{background:rgba(7,6,8,.78)!important;border-color:rgba(255,255,255,.15)!important;backdrop-filter:blur(24px) saturate(130%)!important;box-shadow:0 20px 55px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.08)!important}.bottom button.active{background:linear-gradient(145deg,rgba(230,0,45,.24),rgba(169,0,24,.12))!important;border-color:rgba(255,74,85,.34)!important;box-shadow:inset 0 1px rgba(255,255,255,.10),0 7px 24px rgba(230,0,45,.15)!important}.bottom .fab{background:#fff!important;color:#050506!important;box-shadow:0 10px 28px rgba(255,255,255,.12)!important}

          /* Bento grid: let the cards become the grid instead of stacking two legacy columns. */
          .layout{display:grid!important;grid-template-columns:repeat(12,minmax(0,1fr))!important;gap:14px!important;max-width:1480px!important}.layout>.stack{display:contents!important}.upload{grid-column:span 12}.viewer{grid-column:span 8}.camera-card{grid-column:span 7}.gestures{grid-column:span 5}.metric-card{grid-column:span 4}.right .metric-card:last-child{grid-column:span 4}.right .metric-card:nth-child(3){grid-column:span 4}
          .scroll{padding:18px 22px 34px!important}.topbar{height:72px!important}.status{background:rgba(10,7,9,.72)!important}

          @media(max-width:760px){
            body{background-image:radial-gradient(95vw 70vw at 92% 5%,rgba(255,51,77,.20),transparent 67%),radial-gradient(90vw 70vw at 0% 70%,rgba(169,0,24,.22),transparent 68%),linear-gradient(145deg,#050506,#10070a 55%,#050506)!important}
            body:before{width:78vw;height:78vw;left:55vw;top:2vh;filter:blur(28px);opacity:.75}.topbar{height:58px!important;padding:8px 12px!important;background:rgba(5,5,6,.80)!important}.mobile-brand .brand-mark{width:34px!important;height:34px!important;flex-basis:34px!important;border-radius:11px!important}.mobile-brand strong{font-size:13px!important}.mobile-brand span{font-size:8px!important}.status{min-height:31px!important;padding:5px 8px!important;font-size:8px!important}
            .scroll{padding:12px 12px 86px!important}.layout{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.upload{grid-column:1/-1!important;min-height:210px!important;padding:17px 13px!important}.upload h3{font-size:17px!important}.upload p{font-size:10px!important}.upload label{width:min(100%,260px)!important;min-height:43px!important;border-radius:12px!important}.upload-icon{width:54px!important;height:54px!important;border-radius:15px!important}
            .viewer{grid-column:1/-1!important;padding:9px!important;border-radius:17px!important}.viewer-head{margin-bottom:7px!important}.viewer-title{font-size:10px!important}.viewer-actions{gap:5px!important}.viewer-actions .icon{width:31px!important;height:31px!important;border-radius:9px!important}#stage{height:275px!important;min-height:275px!important;border-radius:14px!important}#stage canvas{max-width:86%!important;max-height:230px!important}.hud{display:none!important}.stage-corner{left:8px!important;top:8px!important;font-size:7px!important;padding:5px 7px!important}.empty{max-width:260px!important;padding:13px!important}.empty-icon{width:50px!important;height:50px!important;margin-bottom:8px!important}.empty h3{font-size:16px!important}.empty p{font-size:9px!important}
            .camera-card{grid-column:span 1!important;padding:9px!important;border-radius:17px!important}.camera{height:235px!important;border-radius:13px!important}.metric{font-size:9px!important;margin-bottom:7px!important}.camera-actions{margin-top:7px!important}.camera-actions .danger{width:100%!important;min-height:38px!important;font-size:11px!important}
            .gestures{grid-column:span 1!important;padding:10px!important;border-radius:17px!important}.section-head{margin-bottom:8px!important}.section-head span:first-child{font-size:10px!important}.section-head span:last-child{display:none!important}.gesture-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}.gesture-card{min-height:102px!important;padding:9px!important;border-radius:13px!important}.gesture-card .gi{font-size:23px!important;margin-bottom:3px!important}.gesture-card b{font-size:9px!important}.gesture-card span{font-size:7px!important}
            .metric-card{grid-column:span 1!important;min-height:124px!important;padding:12px!important;border-radius:16px!important}.metric-top{font-size:9px!important}.metric-big{font-size:17px!important;margin-top:12px!important}.confidence{gap:9px!important;margin-top:10px!important}.ring{width:54px!important;height:54px!important;flex-basis:54px!important}.confidence-copy{font-size:9px!important}.confidence small{font-size:7px!important}.right .metric-card:last-child,.right .metric-card:nth-child(3){grid-column:1/-1!important;min-height:106px!important}.file-name{font-size:9px!important}
            .bottom{left:10px!important;right:10px!important;bottom:max(7px,env(safe-area-inset-bottom))!important;height:60px!important;padding:4px!important;border-radius:18px!important}.bottom button{font-size:8px!important;border-radius:14px!important}.bottom button i{font-size:14px!important}
          }
          @media(max-width:390px){.scroll{padding-left:9px!important;padding-right:9px!important}.layout{gap:8px!important}.camera{height:215px!important}#stage{height:245px!important;min-height:245px!important}.metric-card{min-height:116px!important}.upload{min-height:198px!important}}
          @keyframes orbFloat{from{transform:translate3d(-2vw,-1vh,0) scale(.94) rotate(-3deg)}to{transform:translate3d(3vw,4vh,0) scale(1.08) rotate(4deg)}}
          @keyframes orbFloat2{from{transform:translate3d(0,2vh,0) scale(.94)}to{transform:translate3d(-5vw,-3vh,0) scale(1.12)}}
          @keyframes stageOrb{from{transform:translate3d(0,0,0) scale(.9)}to{transform:translate3d(-7%,8%,0) scale(1.12)}}
          @keyframes glassSweep{0%,100%{transform:translateX(-12%);opacity:.18}50%{transform:translateX(12%);opacity:.58}}
          @media(prefers-reduced-motion:reduce){body:before,body:after,#stage:before,#stage:after{animation:none!important}}
          </style>'''

          pattern = r'<style id="red-cinematic-bento">.*?</style>'
          if re.search(pattern, s, flags=re.S):
              s = re.sub(pattern, css, s, count=1, flags=re.S)
          else:
              # Remove the previous visual-system override so styles don't fight each other.
              s = re.sub(r'<style id="liquid-aurora-theme">.*?</style>', '', s, flags=re.S)
              s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit bento UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Build 3D red bento interface'
          git push
